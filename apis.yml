name: Alignable
description: Alignable is a business networking platform that connects small business
  owners and entrepreneurs across North America. Its members build local referral
  relationships, join discussion groups and networking events, request and give business
  introductions, and use intelligent matching tools to find nearby partners, suppliers,
  and customers. The platform reports more than 10 million members and focuses on
  peer support and word-of-mouth growth for small businesses. Alignable does not
  currently publish a public developer API, SDKs, or developer portal; this profile
  captures its public web presence, policies, and domain-security posture.
